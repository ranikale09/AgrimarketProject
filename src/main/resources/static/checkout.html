<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>Checkout – AgriMarket</title></head><body>
<div id="site-header"></div>
<main class="wrap"><h1 style="margin-top:28px">Checkout</h1>
<div class="two"><form class="card panel form" id="f">
  <h2>Delivery address</h2>
  <label>Full name<input class="field" name="name" required></label>
  <label>Phone<input class="field" name="phone" required inputmode="tel"></label>
  <label>Address<input class="field" name="line" required placeholder="House no., street, landmark"></label>
  <div class="two-col"><label>City<input class="field" name="city" required></label><label>Pincode<input class="field" name="pin" required inputmode="numeric" pattern="[0-9]{6}" title="6-digit pincode"></label></div>
  <h2 style="margin-top:12px">Payment method</h2>
  <label style="font-weight:500;display:flex;gap:8px"><input type="radio" name="pay" value="COD" checked> Cash on delivery</label>
  <label style="font-weight:500;display:flex;gap:8px"><input type="radio" name="pay" value="UPI"> UPI on delivery</label>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" id="go">Place order</button>
</form>
<aside class="card panel" id="sum"></aside></div></main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
<script>
renderHeader(); renderFooter();
(async () => {
  if (!requireLogin()) return;
  const items = await api("/cart");
  if (!items.length) { location.href = "cart.html"; return; }
  const sub = items.reduce((s, i) => s + i.product.price * i.quantity, 0), del = deliveryFor(sub);
  document.querySelector("[name=name]").value = store.user.name;
  document.getElementById("sum").innerHTML = "<h3>Order summary</h3>" + items.map(i =>
    '<div class="sum"><span>' + (i.product.emoji || "") + " " + esc(i.product.name) + " × " + i.quantity + " " + esc(i.product.unit) + "</span><span>" + money(i.product.price * i.quantity) + "</span></div>").join("") +
    '<div class="sum"><span>Delivery charges</span><span>' + (del ? money(del) : "Free") + "</span></div>" +
    '<div class="sum total"><span>Total</span><b>' + money(sub + del) + "</b></div>";
})().catch(e => toast(e.message));
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const f = new FormData(ev.target), btn = document.getElementById("go"), err = document.getElementById("err");
  err.textContent = ""; btn.disabled = true;
  const address = f.get("name") + ", " + f.get("line") + ", " + f.get("city") + " " + f.get("pin") + ". Phone: " + f.get("phone");
  try { await api("/orders", { method: "POST", body: { address, paymentMethod: f.get("pay") } }); location.href = "orders.html?placed=1"; }
  catch (e) { err.textContent = e.message; btn.disabled = false; }
};
</script></body></html>
